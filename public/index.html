<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ASSISTENTE}}</title>
  <meta name="description" content="Tire dúvidas sobre habilitação, veículos, multas e licenciamento com o {{SIGLA}}." />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app" role="main">
    <!-- Cabeçalho institucional -->
    <header class="topbar">
      <div class="brand">
        <div class="logo">
          <img class="brand-mark" src="{{MARCA}}" alt="{{SIGLA}}" />
        </div>
        <div class="brand-text">
          <span class="eyebrow">{{NOME}}</span>
          <span class="title">{{ASSISTENTE}}</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="open-docs" class="ghost-btn" title="Documentos e formulários">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
          Documentos
        </button>
        <button id="reset" class="ghost-btn hidden" title="Nova conversa">↺ Nova conversa</button>
      </div>
    </header>

    <!-- Conversa -->
    <section id="scroll" class="scroll" aria-live="polite">
      <div id="empty" class="empty">
        <img class="welcome-logo" src="{{LOGO}}" alt="{{SIGLA}}" />
        <h2>{{BVTITULO}}</h2>
        <p>{{BVTEXTO}}</p>
        <div id="suggestions" class="suggestions"></div>
        <button id="empty-docs" class="docs-cta">
          <span class="docs-cta-icon">📄</span>
          <span>
            <strong>Preencher um documento</strong>
            <small>Procuração, comunicação de venda, intenção de venda e mais — com ajuda guiada.</small>
          </span>
          <span class="docs-cta-arrow">→</span>
        </button>
        <div class="channels">{{{CANAIS}}}</div>
      </div>
      <div id="thread" class="thread"></div>
    </section>

    <!-- Entrada -->
    <footer class="composer">
      <div id="error" class="error hidden"></div>
      <div class="inputrow">
        <textarea id="input" rows="1" placeholder="Pergunta sobre CNH, veículos, multas, licenciamento…"></textarea>
        <button id="send" aria-label="Enviar pergunta">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
          </svg>
        </button>
      </div>
      <p class="disclaimer">Informativo — confirme valores e prazos {{CONTATO}}. Não substitui o atendimento do {{SIGLA}}.</p>
    </footer>
  </main>

  <!-- Painel de Documentos (overlay) -->
  <div id="docs-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="docs-title">
    <div class="overlay-card">
      <header class="overlay-head">
        <button id="docs-back" class="icon-btn hidden" title="Voltar">←</button>
        <h3 id="docs-title">Documentos e formulários</h3>
        <button id="docs-close" class="icon-btn" title="Fechar">✕</button>
      </header>
      <div id="docs-body" class="overlay-body"><!-- preenchido via JS --></div>
    </div>
  </div>

  <script src="/app.js"></script>
  <!-- Acessibilidade em Libras (VLibras — gov.br) -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>new window.VLibras.Widget('https://vlibras.gov.br/app');</script>
</body>
</html>
