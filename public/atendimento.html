<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atendimento — {{SIGLA}}</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .at-wrap { max-width: 1200px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; background: var(--paper); border-left: 1px solid var(--paper-edge); border-right: 1px solid var(--paper-edge); }
    .at-body { flex: 1; display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
    @media (max-width: 760px) { .at-body { grid-template-columns: 1fr; } .at-body.aberta .fila { display: none; } .at-body:not(.aberta) .conv { display: none; } }
    .fila { border-right: 1px solid var(--paper-edge); display: flex; flex-direction: column; min-height: 0; background: #FBFAF6; }
    .filtros { display: flex; gap: 6px; padding: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--paper-edge); }
    .fl { cursor: pointer; border: 1px solid var(--paper-edge); background: #fff; border-radius: 999px; padding: 6px 11px; font-size: 12.5px; font-weight: 600; color: #24304F; }
    .fl.on { background: var(--moss); color: #fff; border-color: var(--moss); }
    .busca { margin: 8px 10px; padding: 9px 11px; border: 1px solid #D3DCE6; border-radius: 10px; font: inherit; font-size: 13px; }
    .lista { flex: 1; overflow-y: auto; }
    .item { padding: 11px 13px; border-bottom: 1px solid var(--paper-edge); cursor: pointer; }
    .item:hover { background: #F2EFE7; } .item.sel { background: #E9F2EE; }
    .item .l1 { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--ayio-navy); }
    .item .l2 { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item .hr { font-size: 11px; color: #7C86A0; font-weight: 500; white-space: nowrap; }
    .tag { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; margin-right: 4px; }
    .tag.esp { background: #FDECC8; color: #8A5A00; } .tag.meu { background: var(--t-claro, #E3F6F2); color: var(--moss-deep); } .tag.out { background: #EEE; color: #555; }
    .conv { display: flex; flex-direction: column; min-height: 0; }
    .conv-top { padding: 12px 16px; border-bottom: 1px solid var(--paper-edge); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface); }
    .conv-top .quem { flex: 1; min-width: 180px; } .conv-top .quem b { font-size: 15px; } .conv-top .quem small { display: block; color: var(--ink-soft); font-size: 12px; }
    .btn { cursor: pointer; border: 0; border-radius: 10px; font-size: 13px; font-weight: 600; padding: 9px 13px; }
    .btn.pri { background: var(--moss); color: #fff; } .btn.soft { background: var(--chip); color: #24304F; } .btn.warn { background: #F4E4DC; color: #9A4B1B; }
    .btn:disabled { opacity: .5; cursor: default; }
    .msgs { flex: 1; overflow-y: auto; padding: 16px; }
    .m { max-width: 76%; padding: 9px 13px; border-radius: 13px; font-size: 14px; line-height: 1.45; margin-bottom: 8px; white-space: pre-wrap; word-wrap: break-word; }
    .m small { display: block; font-size: 11px; opacity: .7; margin-top: 4px; }
    .m.CIDADAO { background: #fff; border: 1px solid var(--paper-edge); }
    .m.BOT { background: #EEF2F7; margin-left: auto; } .m.ATENDENTE { background: #DDEFE6; margin-left: auto; }
    .m.SISTEMA { background: transparent; color: #6B7690; font-size: 12px; text-align: center; margin: 6px auto; max-width: 90%; }
    .m a { color: var(--moss-deep); }
    .resp { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--paper-edge); background: var(--surface); }
    .resp textarea { flex: 1; resize: none; min-height: 44px; max-height: 140px; padding: 10px 12px; border: 1px solid #D3DCE6; border-radius: 10px; font: inherit; font-size: 14px; }
    .vazio { margin: auto; color: var(--ink-soft); font-size: 14px; text-align: center; padding: 30px; }
    .erro { background: var(--warn-bg); color: var(--warn-ink); font-size: 13px; padding: 8px 12px; margin: 8px 12px 0; border-radius: 9px; }
    .login-box { max-width: 380px; margin: 14vh auto 0; background: var(--surface); border: 1px solid var(--paper-edge); border-radius: 14px; padding: 20px; }
    .login-box input { width: 100%; padding: 10px 12px; border: 1px solid #D3DCE6; border-radius: 10px; font: inherit; margin-top: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="at-wrap">
    <header class="topbar">
      <div class="brand">
        <div class="logo"><img class="brand-mark" src="{{MARCA}}" alt="{{SIGLA}}" /></div>
        <div class="brand-text"><span class="eyebrow">{{SIGLA}} · Uso interno</span><span class="title">Atendimento</span></div>
      </div>
      <div class="topbar-actions">
        <span id="contador" class="ghost-btn hidden" style="cursor:default"></span>
        <a href="/{{SLUG}}/balcao" class="ghost-btn">🏛️ Balcão</a>
        <button id="sair" class="ghost-btn hidden">Sair</button>
      </div>
    </header>

    <div id="login" class="login-box">
      <h3 style="margin:0 0 4px">Entrar no Atendimento</h3>
      <p class="sub" style="font-size:12.5px;color:var(--ink-soft);margin:0 0 6px">Conversas do WhatsApp do {{SIGLA}} que pediram atendente.</p>
      <input id="l-user" placeholder="Usuário" autocomplete="username" />
      <input id="l-pwd" type="password" placeholder="Senha" autocomplete="current-password" />
      <div id="l-msg" style="color:var(--warn-ink);font-size:13px;margin-top:8px"></div>
      <button id="l-ok" class="btn pri" style="margin-top:12px">Entrar</button>
    </div>

    <div id="painel" class="at-body hidden">
      <aside class="fila">
        <div class="filtros">
          <button class="fl on" data-st="HUMANO">Com atendente</button>
          <button class="fl" data-st="BOT">Com o bot</button>
          <button class="fl" data-st="ENCERRADA">Encerradas</button>
        </div>
        <input id="busca" class="busca" placeholder="Buscar por telefone ou nome" />
        <div id="lista" class="lista"></div>
      </aside>
      <section class="conv">
        <div id="sem-conv" class="vazio">Escolha uma conversa na fila.</div>
        <div id="com-conv" class="hidden" style="display:flex;flex-direction:column;min-height:0;flex:1">
          <div class="conv-top">
            <button id="voltar" class="btn soft" title="Voltar para a fila">←</button>
            <div class="quem"><b id="c-nome">—</b><small id="c-info"></small></div>
            <button id="b-assumir" class="btn pri hidden">Assumir</button>
            <button id="b-transferir" class="btn soft hidden">Puxar para atendimento</button>
            <button id="b-devolver" class="btn soft hidden">Devolver ao bot</button>
            <button id="b-encerrar" class="btn warn hidden">Encerrar</button>
          </div>
          <div id="c-erro" class="erro hidden"></div>
          <div id="msgs" class="msgs"></div>
          <div id="resp" class="resp hidden">
            <textarea id="r-texto" placeholder="Escreva a resposta (Enter envia, Shift+Enter quebra linha)"></textarea>
            <button id="r-ok" class="btn pri">Enviar</button>
          </div>
        </div>
      </section>
    </div>
  </div>
  <script src="/sessao.js"></script>
  <script src="/atendimento.js"></script>
</body>
</html>
