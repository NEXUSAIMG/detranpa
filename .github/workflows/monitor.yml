# Monitor externo do Assistente DETRAN.
# A cada 10 minutos chama /api/saude. Se algo estiver fora do ar (banco,
# armazenamento, BotAyio ou WhatsApp de um DETRAN cliente) a execução falha
# e o GitHub manda e-mail para quem configurou o agendamento (Settings >
# Notifications > Actions: "Send notifications for failed workflows only").
name: Monitor de saúde

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  saude:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checar /api/saude (2 tentativas)
        env:
          URL: ${{ vars.MONITOR_URL || 'https://detranpa-production.up.railway.app/api/saude' }}
        run: |
          for i in 1 2; do
            code=$(curl -s -o resp.json -w '%{http_code}' --max-time 45 "$URL" || echo 000)
            echo "Tentativa $i: HTTP $code"
            cat resp.json 2>/dev/null; echo
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "::error title=Assistente DETRAN fora do ar::$(head -c 500 resp.json 2>/dev/null)"
          exit 1

  # Pré-aquecimento do cache (1x por hora, opcional): responde de antemão as
  # perguntas mais frequentes. Só roda se o segredo CRON_SECRET estiver em
  # Settings > Secrets and variables > Actions. Nunca derruba o monitor.
  aquecer:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aquecer cache das perguntas frequentes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE: ${{ vars.APP_URL || 'https://detranpa-production.up.railway.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Sem CRON_SECRET nos segredos do repositório: pulando."; exit 0; fi
          if [ "$(date -u +%M | sed 's/^0//')" -ge 10 ]; then echo "Só na primeira rodada de cada hora."; exit 0; fi
          curl -s --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/cron/aquecer" || true
